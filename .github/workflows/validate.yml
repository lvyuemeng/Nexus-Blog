name: PR Validation

on:
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.165.0'
          extended: true

      - name: Verify note contract
        run: go test ./... -count=1

      - name: Build site (drafts + future posts)
        run: hugo --gc --minify --buildDrafts --buildFuture

      - name: Verify build output
        run: |
          test -s public/index.html
          find public -name '*.html' -print -quit | grep -q .
