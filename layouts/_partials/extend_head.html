{{- if .Param "math" -}}
<script>
  window.MathJax = {
    tex: {
      displayMath: [['\\[', '\\]'], ['$$', '$$']],
      inlineMath: [['\\(', '\\)']],
      processEscapes: true
    },
    loader: { load: ['ui/safe'] },
    options: { enableMenu: false }
  };
</script>
<script id="MathJax-script" defer src="https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-chtml.js"></script>
{{- end -}}
