{{- $mathPattern := `(?m)(\$\$|\\\(|\\\[|\$[^$\r\n]+\$)` -}}
{{- $hasMath := or (.Param "math") (gt (len (findRE $mathPattern .RawContent 1)) 0) -}}
{{- if $hasMath -}}
<script>
  window.MathJax = {
    tex: {
      displayMath: [['\\[', '\\]'], ['$$', '$$']],
      inlineMath: [['\\(', '\\)'], ['$', '$']],
      processEscapes: true
    },
    loader: { load: ['ui/safe'] },
    options: { enableMenu: false }
  };
</script>
<script id="MathJax-script" defer src="https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-chtml.js"></script>
{{- end -}}
