<style>
  .pdf-card {
    width: 100%;
    margin: 1em 0;
    overflow: hidden;
    color: var(--pdf-fg, #1a1a1a);
    background: var(--pdf-bg, #f8f9fa);
    border-radius: 10px;
    box-shadow: 0 4px 12px rgb(0 0 0 / 15%);
  }

  .pdf-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.5em 1em;
    font-size: 0.9em;
    background: var(--pdf-controls-bg, #e9ecef);
    border-bottom: 1px solid var(--pdf-border, #dee2e6);
  }

  .pdf-nav-buttons {
    display: flex;
    gap: 0.5em;
    align-items: center;
  }

  .pdf-page-info {
    opacity: 0.7;
    font-variant-numeric: tabular-nums;
  }

  .pdf-btn {
    padding: 0.3em 0.7em;
    color: var(--pdf-fg, #1a1a1a);
    font: inherit;
    font-weight: 500;
    line-height: 1.4;
    text-decoration: none;
    cursor: pointer;
    background: var(--pdf-btn-bg, #fff);
    border: 1px solid var(--pdf-border, #dee2e6);
    border-radius: 6px;
  }

  .pdf-btn:hover,
  .pdf-btn:focus-visible {
    background: var(--pdf-btn-hover, #dee2e6);
  }

  .pdf-btn:disabled {
    cursor: not-allowed;
    opacity: 0.4;
  }

  .pdf-container {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    width: 100%;
    height: var(--pdf-height, 80vh);
    overflow: auto;
    background: var(--pdf-container-bg, #fff);
  }

  .pdf-canvas {
    display: block;
    width: 95%;
    height: auto;
  }

  .pdf-loading,
  .pdf-error {
    padding: 2em;
    font-size: 0.9em;
  }

  .pdf-loading {
    opacity: 0.5;
  }

  .pdf-error {
    color: #dc3545;
  }

  @media (prefers-color-scheme: dark) {
    .pdf-card {
      --pdf-bg: #1d1e20;
      --pdf-fg: #e0e0e0;
      --pdf-controls-bg: #2a2b2e;
      --pdf-border: #3a3b3f;
      --pdf-btn-bg: #3a3b3f;
      --pdf-btn-hover: #4a4b4f;
      --pdf-container-bg: #252628;

      box-shadow: 0 4px 12px rgb(0 0 0 / 50%);
    }
  }
</style>

<script type="module">
  import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/build/pdf.mjs';

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/build/pdf.worker.mjs';

  function initializeViewer(container) {
    if (container.dataset.pdfInitialized === 'true') return;
    container.dataset.pdfInitialized = 'true';

    const canvas = container.querySelector('.pdf-canvas');
    const context = canvas.getContext('2d');
    const previous = container.querySelector('.pdf-prev');
    const next = container.querySelector('.pdf-next');
    const currentPage = container.querySelector('.pdf-page');
    const pageCount = container.querySelector('.pdf-pages');
    const loading = container.querySelector('.pdf-loading');
    const viewportContainer = container.querySelector('.pdf-container');

    let documentHandle;
    let pageNumber = 1;
    let renderPending = false;

    function showError(message) {
      loading.hidden = true;
      const error = document.createElement('div');
      error.className = 'pdf-error';
      error.textContent = message;
      viewportContainer.appendChild(error);
    }

    async function renderPage(number) {
      if (!documentHandle || renderPending) return;
      renderPending = true;

      try {
        const page = await documentHandle.getPage(number);
        const initialViewport = page.getViewport({ scale: 1 });
        const scale = viewportContainer.clientWidth / initialViewport.width;
        const viewport = page.getViewport({ scale });
        const outputScale = window.devicePixelRatio || 1;

        canvas.width = Math.floor(viewport.width * outputScale);
        canvas.height = Math.floor(viewport.height * outputScale);
        canvas.style.width = `${Math.floor(viewport.width)}px`;
        canvas.style.height = `${Math.floor(viewport.height)}px`;

        await page.render({
          canvasContext: context,
          transform: outputScale === 1 ? null : [outputScale, 0, 0, outputScale, 0, 0],
          viewport,
        }).promise;

        currentPage.textContent = String(number);
        previous.disabled = number <= 1;
        next.disabled = number >= documentHandle.numPages;
      } catch (error) {
        showError(`Failed to render page: ${error.message}`);
      } finally {
        renderPending = false;
      }
    }

    pdfjsLib.getDocument({
      url: container.dataset.pdfUrl,
      enableScripting: false,
      isEvalSupported: false,
    }).promise.then((pdf) => {
      documentHandle = pdf;
      pageCount.textContent = String(pdf.numPages);
      loading.hidden = true;
      canvas.hidden = false;
      return renderPage(pageNumber);
    }).catch((error) => {
      showError(`Failed to load PDF: ${error.message}`);
    });

    previous.addEventListener('click', () => {
      if (pageNumber <= 1) return;
      pageNumber -= 1;
      renderPage(pageNumber);
    });

    next.addEventListener('click', () => {
      if (!documentHandle || pageNumber >= documentHandle.numPages) return;
      pageNumber += 1;
      renderPage(pageNumber);
    });

    let resizeTimer;
    window.addEventListener('resize', () => {
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(() => renderPage(pageNumber), 150);
    });
  }

  function initializeViewers() {
    document.querySelectorAll('[data-pdf-viewer]').forEach(initializeViewer);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initializeViewers, { once: true });
  } else {
    initializeViewers();
  }
</script>
